services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - dev.env
    container_name: magnit-bot
    environment:
      CHECKLIST_PATH: /app/checklist.txt
      LOGS_DIR: /app/logs
      TIMEZONE: Europe/Moscow
    volumes:
      - ./checklist.txt:/app/checklist.txt:ro
      - ./telegram.yml:/app/telegram.yml:ro
      - ./logs:/app/logs
    restart: unless-stopped
